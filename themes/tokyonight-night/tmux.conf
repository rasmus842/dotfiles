# tokyonight-night — tmux colors
#
# Sourced by tmux.conf via themes/current. `source-file` only applies the
# options it names, so every theme fragment must set the same option list —
# otherwise switching leaves the previous theme's colors behind.
#
# bg          #1a1b26   fg          #c0caf5   blue    #7aa2f7
# bg_dark     #16161e   fg_dark     #a9b1d6   cyan    #7dcfff
# bg_highlight#292e42   comment     #565f89   green   #9ece6a
# fg_gutter   #3b4261   dark3       #545c7e   yellow  #e0af68
# bg_search   #3d59a1   terminal_bl #414868   red     #f7768e

set -g status-style "bg=#16161e,fg=#c0caf5"
set -g message-style "bg=#16161e,fg=#c0caf5"
set -g message-command-style "bg=#16161e,fg=#e0af68"

set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"

set -g mode-style "bg=#7aa2f7,fg=#1a1b26"

set -g copy-mode-match-style "bg=#e0af68,fg=#1a1b26"
set -g copy-mode-current-match-style "bg=#7aa2f7,fg=#1a1b26"

setw -g window-status-style "fg=#a9b1d6,bg=#16161e"
setw -g window-status-current-style "fg=#1a1b26,bg=#e0af68,bold"

# Session badge, then a powerline separator back into the status bar background.
set -g status-left "#[fg=#1a1b26,bg=#7aa2f7,bold] #S #[fg=#7aa2f7,bg=#16161e,nobold]"
set -g status-right "#[fg=#565f89] %Y-%m-%d #[fg=#c0caf5] %H:%M "
