# catppuccin-mocha — tmux colors
#
# Sourced by tmux.conf via themes/current. `source-file` only applies the
# options it names, so every theme fragment must set the same option list —
# otherwise switching leaves the previous theme's colors behind.
#
# base     #1e1e2e   text     #cdd6f4   red    #f38ba8   blue     #89b4fa
# mantle   #181825   subtext1 #bac2de   green  #a6e3a1   mauve    #cba6f7
# surface0 #313244   overlay0 #6c7086   yellow #f9e2af   teal     #94e2d5
# surface1 #45475a   overlay1 #7f849c   peach  #fab387   lavender #b4befe

set -g status-style "bg=#181825,fg=#cdd6f4"
set -g message-style "bg=#181825,fg=#cdd6f4"
set -g message-command-style "bg=#181825,fg=#f9e2af"

set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"

set -g mode-style "bg=#89b4fa,fg=#1e1e2e"

set -g copy-mode-match-style "bg=#f9e2af,fg=#1e1e2e"
set -g copy-mode-current-match-style "bg=#89b4fa,fg=#1e1e2e"

setw -g window-status-style "fg=#bac2de,bg=#181825"
setw -g window-status-current-style "fg=#1e1e2e,bg=#f9e2af,bold"

# Session badge, then a powerline separator into whatever follows it. `#{W:,X}`
set -g status-left "#[fg=#1e1e2e,bg=#89b4fa,bold] #S #[fg=#89b4fa,bg=#{?#{W:,#{?window_start_flag,1,0}},#f9e2af,#181825},nobold]"
set -g status-right "#[fg=#6c7086] %Y-%m-%d #[fg=#cdd6f4] %H:%M "
