# gruvbox-dark — tmux colors
#
# Sourced by tmux.conf via themes/current. `source-file` only applies the
# options it names, so every theme fragment must set the same option list —
# otherwise switching leaves the previous theme's colors behind.
#
# bg0  #282828   fg0  #fbf1c7   red    #cc241d   blue   #458588
# bg1  #3c3836   fg1  #ebdbb2   green  #98971a   purple #b16286
# bg3  #665c54   gray #928374   yellow #d79921   aqua   #689d6a

set -g status-style "bg=#3c3836,fg=#ebdbb2"
set -g message-style "bg=#3c3836,fg=#fbf1c7"
set -g message-command-style "bg=#3c3836,fg=#d79921"

set -g pane-border-style "fg=#665c54"
# bright_blue rather than neutral #458588: reads much better as a thin border
# and matches the ANSI blue gruvbox terminals actually ship.
set -g pane-active-border-style "fg=#83a598"

set -g mode-style "bg=#458588,fg=#282828"

set -g copy-mode-match-style "bg=#d79921,fg=#282828"
set -g copy-mode-current-match-style "bg=#458588,fg=#282828"

setw -g window-status-style "fg=#ebdbb2,bg=#3c3836"
setw -g window-status-current-style "fg=#282828,bg=#d79921,bold"

# Powerline caps on the active window; the left one is dropped when it is
# leftmost, since status-left already draws that separator.
setw -g window-status-current-format "#[fg=#d79921,bg=#3c3836]#{?window_start_flag,,}#[fg=#282828,bg=#d79921,bold] #I:#W #[fg=#d79921,bg=#3c3836,nobold]"

# Session badge, then a powerline separator into whatever follows it. `#{W:,X}`
set -g status-left "#[fg=#282828,bg=#689d6a,bold] #S #[fg=#689d6a,bg=#{?#{W:,#{?window_start_flag,1,0}},#d79921,#3c3836},nobold]"
set -g status-right "#[fg=#928374] %Y-%m-%d #[fg=#ebdbb2] %H:%M "
