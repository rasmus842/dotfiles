# reload tmux conf with prefix-r
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "config sourced"

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

set -g mouse on
set -g history-limit 100000

# Let neovim receive terminal focus changes
set -g focus-events on


# xterm-256color is not conceptually true, set to tmux-256color for now
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# styling fix when running neovim inside tmux
set -as terminal-features ",*usstyle"


# required for WezTerm user variables and shell integration through tmux
#set -g allow-passthrough on


# split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# enable clipboard
set-option -g set-clipboard on

# act like vim
setw -g mode-keys vi

# Seamless navigation and resizing between tmux panes and neovim splits.
# '@pane-is-vim' is a pane-local option set by smart-splits.nvim on load and
# unset when neovim exits or suspends, so tmux knows when to forward the key
# instead of acting on it. See: https://github.com/mrjones2014/smart-splits.nvim
bind-key -n 'C-h' if -F "#{@pane-is-vim}" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if -F "#{@pane-is-vim}" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if -F "#{@pane-is-vim}" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if -F "#{@pane-is-vim}" 'send-keys C-l'  'select-pane -R'

bind-key -n 'M-h' if -F "#{@pane-is-vim}" 'send-keys M-h'  'resize-pane -L 3'
bind-key -n 'M-j' if -F "#{@pane-is-vim}" 'send-keys M-j'  'resize-pane -D 3'
bind-key -n 'M-k' if -F "#{@pane-is-vim}" 'send-keys M-k'  'resize-pane -U 3'
bind-key -n 'M-l' if -F "#{@pane-is-vim}" 'send-keys M-l'  'resize-pane -R 3'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line

# OS-agnostic system clipboard for vi copy-mode.
# Pick the right clipboard tool: pbcopy on macOS, wl-copy on Wayland, xclip on X11.
# (tmux-yank does this too, but binding it explicitly keeps copy working even
#  without the plugin and makes the behaviour obvious.)
if-shell 'test "$(uname)" = Darwin' {
    bind-key -T copy-mode-vi y     send -X copy-pipe-and-cancel "pbcopy"
    bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel "pbcopy"
    bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
    bind-key p run "pbpaste | tmux load-buffer - ; tmux paste-buffer"
} {
    if-shell 'test -n "$WAYLAND_DISPLAY"' {
        bind-key -T copy-mode-vi y     send -X copy-pipe-and-cancel "wl-copy"
        bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel "wl-copy"
        bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"
        bind-key p run "wl-paste | tmux load-buffer - ; tmux paste-buffer"
    } {
        bind-key -T copy-mode-vi y     send -X copy-pipe-and-cancel "xclip -in -selection clipboard"
        bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel "xclip -in -selection clipboard"
        bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -in -selection clipboard"
        bind-key p run "xclip -o -selection clipboard | tmux load-buffer - ; tmux paste-buffer"
    }
}

##### Status bar layout #####
# Colors live in the theme fragment sourced below; only layout is set here.

set -g status on
set -g status-interval 2

set -g status-left-length 40
set -g status-right-length 80

setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "


##### Colors #####
# themes/current is a symlink to the active theme (see dotfiles/themes/).
# Switch with `theme <name>`: it re-sources this fragment into the running
# server, so every pane in every session recolors at once.
source-file -q ~/.config/themes/current/tmux.conf


### PLUGINS
set -g @plugin "tmux-plugins/tpm"
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin "tmux-plugins/tmux-sensible"
set -g @plugin "tmux-plugins/tmux-yank"

# tmux-resurrect
set -g @resurrect_processes 'ssh vi vim top htop man less more tail top'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'

# tmux-continuum - automatic saves and restores (builds on top of tmux-resurrect)
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15' # minutes, 15 by default

run "~/.tmux/plugins/tpm/tpm"
